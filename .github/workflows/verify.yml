name: Verify

on:
  workflow_call:
    inputs:
      repository:
        description: Public repository to verify
        required: false
        type: string
      ref:
        description: Git ref to verify
        required: false
        type: string
      verify_source:
        description: Run Verify from source
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to verify
        required: true
        type: string
      ref:
        description: Git ref to verify
        required: true
        type: string
      verify_source:
        description: Run Verify from source
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.repository || github.repository }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  verify:
    name: All controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Verify
        if: ${{ !inputs.verify_source }}
        run: go -C tools tool secverify --root .. all

      - name: Verify from source
        if: ${{ inputs.verify_source }}
        run: go run -a -buildvcs=true ./cmd/secverify all

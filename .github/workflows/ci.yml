name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false

      - name: Verify tools module
        run: |
          go -C tools mod tidy -diff
          go -C tools mod verify
          go -C tools/actionlint mod tidy -diff
          go -C tools/actionlint mod verify

      - name: Test tools module
        run: go -C tools test -count=1 ./...

      - name: Check tool dependencies
        shell: bash
        run: |
          for owner in tools tools/actionlint; do
            metadata="$RUNNER_TEMP/tool-module.json"
            tool_paths="$RUNNER_TEMP/tool-paths"
            raw_tool_paths="$RUNNER_TEMP/tool-paths.raw"
            module_paths="$RUNNER_TEMP/tool-module-paths"
            normalised_module_paths="$RUNNER_TEMP/tool-module-paths.normalised"
            raw_module_paths="$RUNNER_TEMP/tool-module-paths.raw"
            report="$RUNNER_TEMP/tool-dependencies.json"
            go -C "$owner" mod edit -json >"$metadata"
            python3 - "$metadata" >"$raw_tool_paths" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          tools = value.get("Tool") or []
          if not tools or len(tools) > 64:
              raise SystemExit("invalid tool inventory")
          for tool in tools:
              print(tool["Path"])
          PY
            tr -d '\r' <"$raw_tool_paths" >"$tool_paths"
            mapfile -t tools <"$tool_paths"
            go -C "$owner" list -f '{{with .Module}}{{.Path}}{{end}}' "${tools[@]}" >"$raw_module_paths"
            python3 - "$metadata" >>"$raw_module_paths" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for requirement in value.get("Require") or []:
              if not requirement.get("Indirect"):
                  print(requirement["Path"])
          PY
            tr -d '\r' <"$raw_module_paths" >"$normalised_module_paths"
            sort -u "$normalised_module_paths" >"$module_paths"
            mapfile -t modules <"$module_paths"
            ((${#modules[@]} > 0 && ${#modules[@]} <= 4096))
            go -C "$owner" list -m -u -json "${modules[@]}" >"$report"
            [[ -s "$report" && $(wc -c <"$report") -le $((4 * 1024 * 1024)) ]]
            python3 - "$report" <<'PY'
          import json, pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          failures = []
          while source.lstrip():
              source = source.lstrip()
              value, end = decoder.raw_decode(source)
              source = source[end:]
              if value.get("Main"):
                  continue
              if value.get("Retracted"):
                  failures.append(f'{value["Path"]} {value.get("Version", "")} is retracted')
              update = value.get("Update")
              if update:
                  failures.append(f'{value["Path"]} {value.get("Version", "")} -> {update["Version"]}')
          if failures:
              raise SystemExit("\n".join(sorted(failures)))
          PY
          done

      - name: Check workflows
        shell: bash
        run: |
          found="$RUNNER_TEMP/workflows"
          inventory="$RUNNER_TEMP/workflows.sorted"
          find "$GITHUB_WORKSPACE/.github/workflows" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 >"$found"
          sort -z "$found" >"$inventory"
          mapfile -d '' -t workflows <"$inventory"
          ((${#workflows[@]} > 0 && ${#workflows[@]} <= 64))
          actionlint=$(go -C tools/actionlint tool -n actionlint)
          shellcheck=$(go -C tools/actionlint tool -n shellcheck)
          "$actionlint" -shellcheck="$shellcheck" -color=false "${workflows[@]}"

      - name: Scan Actionlint dependencies
        shell: bash
        run: |
          govulncheck=$(go -C tools tool -n govulncheck)
          (cd tools/actionlint && "$govulncheck" github.com/rhysd/actionlint/cmd/actionlint)

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: actions
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:actions
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

  required:
    name: Required
    if: ${{ always() }}
    needs: [actions, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          if any(value["result"] != "success" for value in results.values()):
              raise SystemExit(1)
          PY
